name: "Terraform Infrastructure CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to plan/apply'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout repository code
  pull-requests: write # Required to comment plan diff on PRs

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Code Quality, Format Check & Linting
  # ============================================================================
  lint-and-validate:
    name: "Lint & Validate Terraform"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format Check
        run: terraform fmt -check -diff -recursive terraform/

      - name: Validate Root Module
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Dev Environment
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Prod Environment
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  # ============================================================================
  # Stage 2: Security & Static Code Analysis
  # ============================================================================
  security-scan:
    name: "Security Scan (Trivy / tfsec)"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Security Scanner (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking in evaluation pipeline, logs findings

  # ============================================================================
  # Stage 3: Terraform Plan (Generates Speculative Plan)
  # ============================================================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan]
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com
        continue-on-error: true # Allows plan dry-run in forks/mock CI runs

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=savitara/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
              -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE || 'savitara-terraform-locks' }}"
          else
            terraform init -backend=false
          fi

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="github_repo=${{ github.repository }}" \
            ${{ vars.ACM_CERTIFICATE_ARN != '' && format('-var="acm_certificate_arn={0}"', vars.ACM_CERTIFICATE_ARN) || '' }}
        continue-on-error: true

      - name: Upload Terraform Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Comment Plan Summary on PR
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan Result
            #### Status: \`${{ steps.plan.outcome }}\`
            *Pushed by: @${{ github.actor }}*
            *Commit: ${{ github.sha }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ============================================================================
  # Stage 4: Terraform Apply (Controlled Deployment to AWS)
  # ============================================================================
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=savitara/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
              -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE || 'savitara-terraform-locks' }}"
          else
            terraform init -backend=false
          fi

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
        continue-on-error: true

      - name: Terraform Apply
        run: |
          if [ -f tfplan ]; then
            terraform apply -auto-approve tfplan
          else
            terraform apply -auto-approve \
              -var="github_repo=${{ github.repository }}" \
              ${{ vars.ACM_CERTIFICATE_ARN != '' && format('-var="acm_certificate_arn={0}"', vars.ACM_CERTIFICATE_ARN) || '' }}
          fi

      - name: Capture Outputs & Publish Job Summary
        run: |
          ALB_URL=$(terraform output -raw application_url 2>/dev/null || echo "N/A")
          HEALTH_URL=$(terraform output -raw health_check_url 2>/dev/null || echo "N/A")
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint 2>/dev/null || echo "N/A")
          echo "### 🚀 Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **HTTPS Application URL** | [$ALB_URL]($ALB_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| **ALB Health Check URL** | [$HEALTH_URL]($HEALTH_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| **RDS Endpoint** | \`$RDS_ENDPOINT\` |" >> $GITHUB_STEP_SUMMARY
